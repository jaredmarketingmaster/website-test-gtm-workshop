<!DOCTYPE html><html lang="es-AR"><head><meta charset="UTF-8"><title>Widget Agenda</title><style>body{font-family:sans-serif;}</style></head>
<body><form id="form-agenda"><select id="servicio"><option value="cata_basica">Cata Básica</option></select><input type="datetime-local" id="fecha"><button type="submit">Reservar</button></form><div id="msg" style="display:none;color:green;">Reservado!</div>
    <script>document.getElementById('form-agenda').addEventListener('submit', (e) => { e.preventDefault(); document.getElementById('msg').style.display='block'; if(window.parent) window.parent.postMessage({origen:'agenda-practica',evento:'reserva_confirmada',servicio:document.getElementById('servicio').value,fecha:document.getElementById('fecha').value}, '*'); });</script></body></html>
